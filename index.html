<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Konversi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="card-header">
        <span class="brand-dot"></span>
        <h1>Kalkulator Konversi</h1>
      </div>

      <!-- BAGIAN INPUT -->
      <div class="form-group">
        <label for="permintaan">Permintaan (KG)</label>
        <input type="number" id="permintaan" min="0" step="any" placeholder="0" />
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="konversi">Konversi</label>
          <input type="number" id="konversi" min="0" step="any" placeholder="0" />
        </div>

        <div class="form-group">
          <label for="kelipatan">Kelipatan</label>
          <input type="number" id="kelipatan" min="1" step="1" value="1" placeholder="1" />
        </div>
      </div>

      <!-- BAGIAN HASIL (ATAS - BAWAH) -->
      <div class="results-panel">
        <div class="result-block">
          <div class="result-top">
            <span class="result-heading">KG Lebih Besar</span>
          </div>
          <div class="result-values">
            <div class="value-col">
              <span class="value-label">Hasil</span>
              <strong class="focus-number" id="hasil-atas">0</strong>
            </div>
            <div class="value-col value-col-right">
              <span class="value-label">Total KG</span>
              <strong class="focus-number" id="kg-atas">0 KG</strong>
            </div>
          </div>
        </div>

        <hr class="divider" />

        <div class="result-block">
          <div class="result-top">
            <span class="result-heading">KG Lebih Kecil</span>
          </div>
          <div class="result-values">
            <div class="value-col">
              <span class="value-label">Hasil</span>
              <strong class="focus-number" id="hasil-bawah">0</strong>
            </div>
            <div class="value-col value-col-right">
              <span class="value-label">Total KG</span>
              <strong class="focus-number" id="kg-bawah">0 KG</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- TOMBOL RESET -->
      <button type="button" id="btn-reset" class="btn-reset">Reset</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
